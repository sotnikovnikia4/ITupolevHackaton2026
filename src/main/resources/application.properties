spring.application.name=hackaton

spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/itupolev

server.port=8080

spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:migrations/master.xml
spring.liquibase.enabled=true

spring.security.user.name=admin
spring.security.user.password=secret123

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger
springdoc.swagger-ui.url=/openapi.yaml

cors.allowedOrigins=http://localhost:3000,http://localhost:8080

logging.level.ru.itupolev.hackaton=TRACE